<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="812" viewBox="0 0 1280 812">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.hdr{font-weight:700}.num{font-weight:700}</style>
<rect x="0" y="0" width="1280" height="6" fill="#7c3aed"/>
<text x="56" y="62" font-size="34" font-weight="700" text-anchor="start" fill="#111827">离谱 Lilipu：五线谱 → 简谱</text>
<text x="56" y="96" font-size="16" font-weight="400" text-anchor="start" fill="#6b7280">把乐谱图片、扫描 PDF 或 MusicXML 拖进窗口，程序自动识别音高与节奏，排出可直接照着弹的简谱。</text>
<text x="56" y="152" font-size="22" font-weight="700" text-anchor="start" fill="#111827">① 输入</text>
<text x="182" y="151" font-size="15" font-weight="400" text-anchor="start" fill="#6b7280">四种来源都能直接扔进来，不需要手工截取或转格式</text>
<rect x="56" y="174" width="274" height="92" rx="12" fill="#fbfbfd" stroke="#e5e7eb" stroke-width="1.2"/>
<path d="M76 208 h18 l10 10 v26 h-28 z" fill="#7c3aed" opacity="0.10"/><path d="M76 208 h18 l10 10 v26 h-28 z" fill="none" stroke="#7c3aed" stroke-width="1.6"/><path d="M94 208 v10 h10" fill="none" stroke="#7c3aed" stroke-width="1.6"/><line x1="82" y1="228" x2="98" y2="228" stroke="#7c3aed" stroke-width="1.6"/><line x1="82" y1="235" x2="94" y2="235" stroke="#7c3aed" stroke-width="1.6"/>
<text x="134" y="214" font-size="19" font-weight="700" text-anchor="start" fill="#111827">乐谱照片</text>
<text x="134" y="240" font-size="13" font-weight="400" text-anchor="start" fill="#6b7280">JPG / PNG，手机拍的也行</text>
<rect x="354" y="174" width="274" height="92" rx="12" fill="#fbfbfd" stroke="#e5e7eb" stroke-width="1.2"/>
<path d="M374 208 h18 l10 10 v26 h-28 z" fill="#7c3aed" opacity="0.10"/><path d="M374 208 h18 l10 10 v26 h-28 z" fill="none" stroke="#7c3aed" stroke-width="1.6"/><path d="M392 208 v10 h10" fill="none" stroke="#7c3aed" stroke-width="1.6"/><line x1="380" y1="228" x2="396" y2="228" stroke="#7c3aed" stroke-width="1.6"/><line x1="380" y1="235" x2="392" y2="235" stroke="#7c3aed" stroke-width="1.6"/>
<text x="432" y="214" font-size="19" font-weight="700" text-anchor="start" fill="#111827">扫描 PDF</text>
<text x="432" y="240" font-size="13" font-weight="400" text-anchor="start" fill="#6b7280">多页自动拆页识别</text>
<rect x="652" y="174" width="274" height="92" rx="12" fill="#fbfbfd" stroke="#e5e7eb" stroke-width="1.2"/>
<path d="M672 208 h18 l10 10 v26 h-28 z" fill="#7c3aed" opacity="0.10"/><path d="M672 208 h18 l10 10 v26 h-28 z" fill="none" stroke="#7c3aed" stroke-width="1.6"/><path d="M690 208 v10 h10" fill="none" stroke="#7c3aed" stroke-width="1.6"/><line x1="678" y1="228" x2="694" y2="228" stroke="#7c3aed" stroke-width="1.6"/><line x1="678" y1="235" x2="690" y2="235" stroke="#7c3aed" stroke-width="1.6"/>
<text x="730" y="214" font-size="19" font-weight="700" text-anchor="start" fill="#111827">MusicXML</text>
<text x="730" y="240" font-size="13" font-weight="400" text-anchor="start" fill="#6b7280">.musicxml / .mxl / .xml</text>
<rect x="950" y="174" width="274" height="92" rx="12" fill="#fbfbfd" stroke="#e5e7eb" stroke-width="1.2"/>
<path d="M970 208 h18 l10 10 v26 h-28 z" fill="#7c3aed" opacity="0.10"/><path d="M970 208 h18 l10 10 v26 h-28 z" fill="none" stroke="#7c3aed" stroke-width="1.6"/><path d="M988 208 v10 h10" fill="none" stroke="#7c3aed" stroke-width="1.6"/><line x1="976" y1="228" x2="992" y2="228" stroke="#7c3aed" stroke-width="1.6"/><line x1="976" y1="235" x2="988" y2="235" stroke="#7c3aed" stroke-width="1.6"/>
<text x="1028" y="214" font-size="19" font-weight="700" text-anchor="start" fill="#111827">批量处理</text>
<text x="1028" y="240" font-size="13" font-weight="400" text-anchor="start" fill="#6b7280">一次拖入整本曲谱</text>
<line x1="640.0" y1="278" x2="640.0" y2="312" stroke="#7c3aed" stroke-width="2.4"/>
<path d="M633.0 305 L640.0 314 L647.0 305" fill="none" stroke="#7c3aed" stroke-width="2.4"/>
<text x="662.0" y="302" font-size="14" font-weight="400" text-anchor="start" fill="#6b7280">Audiveris 精准识别音高 / 节奏 / 调号；未装 Audiveris 时自动退回 OpenCV 音高草图模式</text>
<text x="56" y="362" font-size="22" font-weight="700" text-anchor="start" fill="#111827">② 输出</text>
<text x="182" y="361" font-size="15" font-weight="400" text-anchor="start" fill="#6b7280">同一段旋律，程序排出的简谱（矢量导出，缩放不虚）</text>
<rect x="38" y="380" width="886" height="326" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
<svg x="40" y="383" width="884" height="320" viewBox="0 0 884 320">
<text x="64" y="101" class="hdr" font-size="37">1=C   4/4</text>
<line x1="64" y1="136.6" x2="856" y2="136.6" stroke="#d2d2d2" stroke-width="1"/>
