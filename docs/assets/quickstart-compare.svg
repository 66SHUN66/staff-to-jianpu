<text x="340.2" y="216.7" text-anchor="middle" class="num" font-size="44">5</text>
<circle cx="340.2" cy="177.1" r="3" fill="#111"/>
<line x1="316.9" y1="235.2" x2="363.5" y2="235.2" stroke="#111" stroke-width="2"/>
<text x="401.6" y="216.7" text-anchor="middle" class="num" font-size="44">6</text>
<circle cx="401.6" cy="177.1" r="3" fill="#111"/>
<line x1="378.3" y1="235.2" x2="424.9" y2="235.2" stroke="#111" stroke-width="2"/>
<text x="463.0" y="216.7" text-anchor="middle" class="num" font-size="44">7</text>
<circle cx="463.0" cy="177.1" r="3" fill="#111"/>
<line x1="439.7" y1="235.2" x2="486.3" y2="235.2" stroke="#111" stroke-width="2"/>
<text x="524.4" y="216.7" text-anchor="middle" class="num" font-size="44">1</text>
<circle cx="524.4" cy="177.1" r="3" fill="#111"/>
<circle cx="524.4" cy="169.3" r="3" fill="#111"/>
<line x1="501.1" y1="235.2" x2="547.7" y2="235.2" stroke="#111" stroke-width="2"/>
<line x1="580.4" y1="165.2" x2="580.4" y2="248.8" stroke="#282828" stroke-width="2"/>
<text x="636.3" y="216.7" text-anchor="middle" class="num" font-size="44">1</text>
<circle cx="636.3" cy="177.1" r="3" fill="#111"/>
<line x1="672.6" y1="207.0" x2="708.6" y2="207.0" stroke="#111" stroke-width="2"/>
<text x="743.9" y="216.7" text-anchor="middle" class="num" font-size="44">3</text>
<circle cx="743.9" cy="177.1" r="3" fill="#111"/>
<line x1="799.9" y1="165.2" x2="799.9" y2="248.8" stroke="#282828" stroke-width="2"/>
</svg>
<circle cx="962" cy="446" r="5" fill="#7c3aed"/>
<text x="978" y="452" font-size="15" font-weight="700" text-anchor="start" fill="#111827">数字 1–7</text>
<text x="978" y="472" font-size="12" font-weight="400" text-anchor="start" fill="#6b7280">唱名 do–si，音高由调号决定</text>
<circle cx="962" cy="508" r="5" fill="#7c3aed"/>
<text x="978" y="514" font-size="15" font-weight="700" text-anchor="start" fill="#111827">数字上方的点</text>
<text x="978" y="534" font-size="12" font-weight="400" text-anchor="start" fill="#6b7280">高八度，两个点即高两个八度</text>
<circle cx="962" cy="570" r="5" fill="#7c3aed"/>
<text x="978" y="576" font-size="15" font-weight="700" text-anchor="start" fill="#111827">数字下的横线</text>
<text x="978" y="596" font-size="12" font-weight="400" text-anchor="start" fill="#6b7280">时值减半：一条八分音符，两条十六分音符</text>
<circle cx="962" cy="632" r="5" fill="#7c3aed"/>
<text x="978" y="638" font-size="15" font-weight="700" text-anchor="start" fill="#111827">数字后的短横</text>
<text x="978" y="658" font-size="12" font-weight="400" text-anchor="start" fill="#6b7280">每加一条延长一拍</text>
<text x="962" y="716" font-size="13" font-weight="700" text-anchor="start" fill="#7c3aed">调号与拍号</text>
<text x="962" y="736" font-size="12" font-weight="400" text-anchor="start" fill="#6b7280">取自识别结果，不是猜的</text>
<text x="56" y="738" font-size="14" font-weight="400" text-anchor="start" fill="#6b7280">高音点、减时线、小节线、增时线全部按音符时值自动推导，不需要手工标注</text>
<rect x="56" y="758" width="86" height="34" rx="17" fill="#7c3aed" opacity="0.10"/>
<text x="99.0" y="781" font-size="14" font-weight="700" text-anchor="middle" fill="#7c3aed">PNG 图片</text>
<rect x="154" y="758" width="86" height="34" rx="17" fill="#7c3aed" opacity="0.10"/>
<text x="197.0" y="781" font-size="14" font-weight="700" text-anchor="middle" fill="#7c3aed">SVG 矢量</text>
<rect x="252" y="758" width="86" height="34" rx="17" fill="#7c3aed" opacity="0.10"/>
<text x="295.0" y="781" font-size="14" font-weight="700" text-anchor="middle" fill="#7c3aed">TXT 文本</text>
<rect x="350" y="758" width="100" height="34" rx="17" fill="#7c3aed" opacity="0.10"/>
<text x="400.0" y="781" font-size="14" font-weight="700" text-anchor="middle" fill="#7c3aed">MusicXML</text>
<text x="468" y="781" font-size="14" font-weight="400" text-anchor="start" fill="#6b7280">四种导出格式：贴进文档，或回灌进制谱软件</text>
</svg>
