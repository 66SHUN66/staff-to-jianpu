name: Build Windows EXE

# 触发方式：
#   1) 推 v* 标签（正式发布）；
#   2) 修改 CHANGELOG.md 或打包相关文件；
#   3) 手动 workflow_dispatch。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "scripts/lilipu.spec"
      - "scripts/build.py"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path lilipu/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT

      - name: 打包
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/build.py 2>&1 | tee build.log

      - name: 记录构建摘要
        if: always()
        shell: bash
        run: |
          {
            echo "## 打包结果"
            echo ""
            echo "- 打包步骤结论: ${{ steps.build.outcome }}"
            echo "- 版本号: ${{ steps.ver.outputs.version }}"
            echo ""
            echo '```'
            tail -n 80 build.log 2>/dev/null || echo "（没有 build.log）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 确认产物
        if: steps.build.outcome == 'success'
        shell: pwsh
        run: |
          if (-not (Test-Path dist/Lilipu.exe)) { throw "dist/Lilipu.exe 不存在，打包失败" }
          "{0:N1} MB" -f ((Get-Item dist/Lilipu.exe).Length / 1MB)

      - name: 上传构建产物（用于排查）
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Lilipu-windows
          path: dist/Lilipu.exe
          if-no-files-found: error

      - name: 发布到 Release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: 离谱 Lilipu ${{ steps.ver.outputs.version }}
          files: dist/Lilipu.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: 打包失败则让任务失败
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          echo "打包步骤未成功，退出码标记失败"
          exit 1
