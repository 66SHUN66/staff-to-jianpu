name: Build Windows EXE

# 触发方式：
#   1) 推 v* 标签（正式发布）；
#   2) 修改 CHANGELOG.md 或打包相关文件；
#   3) 手动 workflow_dispatch。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "scripts/lilipu.spec"
      - "scripts/build.py"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path lilipu/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT

      - name: 打包
        id: build
        shell: bash
        run: |
          set -o pipefail
          python scripts/build.py 2>&1 | tee build.log

      - name: 失败时提交构建日志
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          slug="${{ github.repository }}"
          {
            echo "# 构建失败日志"
            echo ""
            echo '```'
            tail -n 150 build.log 2>/dev/null || echo 'no build.log'
            echo '```'
          } > ci-log.md
          content=$(base64 -w0 ci-log.md)
          sha=$(gh api "repos/$slug/contents/ci-log.md" --jq .sha 2>/dev/null || true)
          if [ -n "$sha" ]; then
            gh api -X PUT "repos/$slug/contents/ci-log.md" -f message="ci: 构建失败日志" -f content="$content" -f sha="$sha" > /dev/null
          else
            gh api -X PUT "repos/$slug/contents/ci-log.md" -f message="ci: 构建失败日志" -f content="$content" > /dev/null
          fi

      - name: 确认产物
        if: success()
        shell: pwsh
        run: |
          if (-not (Test-Path dist/Lilipu.exe)) { throw "dist/Lilipu.exe 不存在，打包失败" }
          "{0:N1} MB" -f ((Get-Item dist/Lilipu.exe).Length / 1MB)

      - name: 上传构建产物（用于排查）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Lilipu-windows
          path: dist/Lilipu.exe
          if-no-files-found: error

      - name: 发布到 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: 离谱 Lilipu ${{ steps.ver.outputs.version }}
          files: dist/Lilipu.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
