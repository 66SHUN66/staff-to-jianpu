[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lilipu"
description = "离谱 Lilipu：把五线谱图片/PDF 转换成简谱文本与印刷级简谱图片"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "高智顺" }]
keywords = ["jianpu", "简谱", "staff-notation", "五线谱", "OMR", "music", "converter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "pillow>=10.0",
    "music21>=8.0",
    "pymupdf>=1.23",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyflakes>=3.0", "pyinstaller>=6.0"]

[project.gui-scripts]
lilipu = "lilipu.ui.app:main"

[project.urls]
Homepage = "https://github.com/66SHUN66/staff-to-jianpu"

[tool.setuptools]
packages = ["lilipu", "lilipu.core", "lilipu.render", "lilipu.ui"]

[tool.setuptools.dynamic]
version = { attr = "lilipu.__version__" }

[tool.setuptools.package-data]
lilipu = []

[tool.pytest.ini_options]
testpaths = ["tests"]
